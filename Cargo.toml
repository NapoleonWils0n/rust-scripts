[package]
name = "rust_scripts"
version = "0.4.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pinch"
path = "src/bin/pinch.rs"

[[bin]]
name = "relay-mpv"
path = "src/bin/relay-mpv.rs"

[[bin]]
name = "record-pipewire"
path = "src/bin/record-pipewire.rs"

[[bin]]
name = "loopback-oss"
path = "src/bin/loopback-oss.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
libc = "0.2"
crossterm = "0.27"